<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        Admin Login / My Registration | BYTEFEST 2026
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<header>

    <a
        class="brand"
        href="index.html"
    >

        <b>BF</b>

        <span>
            BYTEFEST
            <small>
                2026 · INVICTUS TECH CLUB
            </small>
        </span>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="details.html">
            Details
        </a>

        <a href="admin-login.html">
            Login / My Registration
        </a>

        <a
            class="cta"
            href="register.html"
        >
            Register · ₹150
        </a>

    </nav>

</header>


<main>

<section>

    <p class="eyebrow">
        ACCESS
    </p>


    <h2>
        Admin Login /
        <i>My Registration.</i>
    </h2>


    <div class="formgrid">

        <div class="fee">

            <span>
                ADMIN
            </span>

            <p>
                Use your approved admin email.
            </p>

            <a
                class="btn primary"
                href="#admin"
            >
                Admin Login
            </a>

        </div>


        <div class="fee">

            <span>
                PARTICIPANT
            </span>

            <p>
                Check your registration status
                using your registration ID and email.
            </p>

            <a
                class="btn"
                href="my-registration.html"
            >
                My Registration
            </a>

        </div>

    </div>


    <div
        id="admin"
        style="margin-top:30px"
    >

        <form id="adminLoginForm">

            <label>

                Admin Email

                <input
                    id="adminEmail"
                    type="email"
                    required
                    autocomplete="email"
                    placeholder="admin@example.com"
                >

            </label>


            <button
                class="btn primary full"
                type="submit"
            >
                Continue to Admin
            </button>

        </form>


        <p id="adminMessage"></p>

    </div>

</section>

</main>


<script src="admin.js"></script>

</body>

</html>
