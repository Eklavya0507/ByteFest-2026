<!doctype html>
<html lang="en">
<head>

<body>

<header>
    <a class="brand" href="index.html">

    <nav>

<main>

<section>
    <p class="eyebrow">ADMINISTRATION</p>
    <h2>Registration <i>Dashboard.</i></h2>

    <div id="stats" class="formgrid">
        <div class="fee">
            <span>Total</span>
            <b id="total">0</b>
        </div>

        <div class="fee">
            <span>Pending</span>
            <b id="pending">0</b>
        </div>

        <div class="fee">
            <span>Paid</span>
            <b id="paid">0</b>
        </div>
    </div>
</section>

<section>

<div style="overflow-x:auto">

<table id="registrationTable">
<thead>
<tr>
<th>Registration ID</th>
<th>Event</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Department</th>
<th>Year</th>
<th>Payment</th>
</tr>
</thead>

<tbody id="rows">
<tr>
<td colspan="8">Loading...</td>
</tr>
</tbody>

</table>

</div>

</section>

</main>
